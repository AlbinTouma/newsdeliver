[project]
name = "newsdeliver"
version = "0.1.0"
description = "newsdeliver helps researchers stream news articles from RSS feeds including Google news. The library builds on Trafilatura, feedparser, and google news decoder."
requires-python=">=3.11, <3.16"
authors = [
    {name = "Albin Touma",email = "albin.touma@gmail.com"}
]
dependencies = ["googlenewsdecoder (==0.2.2)"]

[project.optional-dependencies]
playwright = [
    "playwright>=1.63.0,<2.0.0",
]


[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "httpx (>=0.28.1,<0.29.0)"
]



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "newsdeliver"
authors = ["Albin Touma"]
description = "newsdeliver helps researchers build a corpus of news articles"
version = "0.0.1"